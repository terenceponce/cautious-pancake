server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Resolving per request (via the variable below)
  # means the edge survives upstream churn — a static proxy_pass resolves
  # once at boot and dies if the name isn't ready.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api_upstream http://server:3000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
