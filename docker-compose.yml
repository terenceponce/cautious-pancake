services:
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      STORE: redis
      REDIS_URL: redis://redis:6379
      SALE_START: ${SALE_START:?cp .env.example to .env and set the sale window}
      SALE_END: ${SALE_END:?cp .env.example to .env and set the sale window}
      STOCK: ${STOCK:-100}
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8686}:80"
    depends_on:
      server:
        condition: service_healthy
